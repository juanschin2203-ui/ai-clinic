version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rocket-coding-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - rocket-net
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: rocket-coding-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rocket-net
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: rocket-coding-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rocket_coding}
      MYSQL_USER: ${DB_USERNAME:-rocket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
    ports:
      - "3306:3306"
    volumes:
      - rocket-mysql:/var/lib/mysql
    networks:
      - rocket-net

  redis:
    image: redis:alpine
    container_name: rocket-coding-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rocket-net

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rocket-coding-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --tries=3 --timeout=300
    networks:
      - rocket-net
    depends_on:
      - app
      - redis

  mailhog:
    image: mailhog/mailhog
    container_name: rocket-coding-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rocket-net

networks:
  rocket-net:
    driver: bridge

volumes:
  rocket-mysql:
    driver: local
