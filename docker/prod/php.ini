; Rocket Coding — production PHP tuning.
; Deployed as /usr/local/etc/php/conf.d/99-rocket-coding.ini so it
; overrides the base php.ini.

memory_limit = 256M
max_execution_time = 60
post_max_size = 64M
upload_max_filesize = 64M

; Timezone — all datetimes stored UTC; per-clinic display tz is in config.
date.timezone = UTC

; Opcache — the big prod perf win.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0       ; deploy immutably → never revalidate
opcache.revalidate_freq = 0
opcache.save_comments = 1             ; required by Laravel annotations

; Session + cookie hardening (sessions are API-only via Sanctum, but safe defaults).
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"

; Don't leak PHP version in headers.
expose_php = Off

; Realpath cache for faster filesystem ops in containers.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
